plugins {
    id 'com.android.application'
}

import groovy.json.JsonSlurper

// Read app settings from app-config.json (inside www assets)
def configFile = file("src/main/assets/www/app-config.json")
def cfgJson = configFile.exists() ? new JsonSlurper().parse(configFile) : null

def legacyProp = new Properties()
def propFile = file("../app.properties")
if (propFile.exists()) {
    propFile.withInputStream { legacyProp.load(it) }
}

def getCfg = { key, defaultVal ->
    if (cfgJson != null) {
        if (key.startsWith("feature.")) {
            def featName = key.substring(8)
            return (cfgJson.features != null && cfgJson.features[featName] != null) ? cfgJson.features[featName].toString() : defaultVal
        }
        return cfgJson[key] != null ? cfgJson[key].toString() : defaultVal
    }
    return legacyProp.getProperty(key, defaultVal)
}

android {
    namespace 'com.spaila.webview'   // code package: leave as it is
    compileSdk 36

    defaultConfig {
        applicationId getCfg("appId", "com.spaila.newapp")   // the app's permanent ID on phones and Google Play
        minSdk 24
        targetSdk 36
        // GitHub gives every build a higher number, which Google Play requires
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName getCfg("versionName", "1.0.0")
        buildConfigField "String", "START_PAGE", "\"${getCfg('startPage', 'index.html')}\""
        buildConfigField "int", "BAR_COLOR", "0xFF${getCfg('barColor', '0A1F4C')}"
        buildConfigField "boolean", "FEATURE_FLASHLIGHT", "${getCfg('feature.flashlight', 'true')}"
        buildConfigField "boolean", "FEATURE_KEEPALIVE", "${getCfg('feature.keepAlive', 'true')}"
        buildConfigField "boolean", "FEATURE_TTS", "${getCfg('feature.tts', 'true')}"
        buildConfigField "boolean", "FEATURE_SOUNDS", "${getCfg('feature.sounds', 'true')}"
        buildConfigField "boolean", "FEATURE_BRIGHTNESS", "${getCfg('feature.brightness', 'true')}"
        buildConfigField "boolean", "FEATURE_WHATSAPP", "${getCfg('feature.whatsapp', 'true')}"
        buildConfigField "boolean", "FEATURE_RATE_APP", "${getCfg('feature.rateApp', 'true')}"
        buildConfigField "boolean", "FEATURE_BIOMETRICS", "${getCfg('feature.biometrics', 'true')}"
        buildConfigField "boolean", "FEATURE_SPEECH_TO_TEXT", "${getCfg('feature.speechToText', 'true')}"
        resValue "string", "app_name", getCfg("appName", "New App")
        resValue "color", "icon_background", "#${getCfg('barColor', '0A1F4C')}"
    }

    // The signing key arrives from GitHub Secrets while building. It is never in the repo.
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'

    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
