<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature tests</title>
<script src="spaila.js"></script>
<style>
  body { margin:0; padding:24px; background:#0A1F4C; color:#fff; font-family:sans-serif; }
  h1 { font-size:22px; }
  button { display:block; width:100%; margin:10px 0; padding:14px; font-size:17px; border:0; border-radius:12px; }
  a { color:#9cc2ff; }
</style>
</head>
<body>
  <p><a href="index.html">Back</a></p>
  <h1>Feature tests</h1>
  <button onclick="Spaila.vibrate(300)">Vibrate</button>
  <button onclick="Spaila.share('Hello from my Spaila app!')">Share</button>
  <button onclick="Spaila.copyToClipboard('Copied from Spaila!'); Spaila.toast('Copied. Paste somewhere to check.')">Copy to clipboard</button>
  <button onclick="Spaila.keepScreenOn(true); Spaila.toast('Screen will stay on')">Keep screen on: ON</button>
  <button onclick="Spaila.keepScreenOn(false); Spaila.toast('Back to normal')">Keep screen on: OFF</button>
  <button onclick="Spaila.flashlight(true)">Flashlight ON</button>
  <button onclick="Spaila.flashlight(false)">Flashlight OFF</button>
  <button onclick="Spaila.getBatteryLevel().then(function(l){Spaila.toast('Battery: '+l+'%');}).catch(function(e){Spaila.toast('Error: '+e.message);})">Get Battery Level</button>
  <button onclick="Spaila.getBatteryLevel().then(function(l){Spaila.toast('Battery: '+l+'%');}).catch(function(e){Spaila.toast('Error: '+e.message);})">Get Battery Level</button>
<script>
  window.onSpailaBack = function () { location.href = 'index.html'; return true; };
</script>
</body>
</html>
