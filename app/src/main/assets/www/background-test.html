<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background test</title>
<script src="spaila.js"></script>
<style>
  body { margin:0; padding:24px; background:#0A1F4C; color:#fff; font-family:sans-serif; line-height:1.4; }
  h1 { font-size:22px; }
  button { display:block; width:100%; margin:10px 0; padding:14px; font-size:17px; border:0; border-radius:12px; }
  a { color:#9cc2ff; }
  .box { background:#16306b; padding:12px; border-radius:12px; margin:14px 0; }
</style>
</head>
<body>
  <p><a href="index.html">Back</a></p>
  <h1>Background test</h1>
  <div class="box">
    <b>How to test</b><br>
    1. Tap a button below (allow notifications if asked).<br>
    2. Test A: leave the app open. Test B: press Home. Test C: swipe the app away from recents and lock the phone.<br>
    3. Wait. Does the notification arrive on time?
  </div>
  <button onclick="Spaila.scheduleNotification(101, 'Background test', 'Alarm fired after 20 seconds', 20); Spaila.toast('Alarm set for 20 seconds')">Alarm in 20 seconds</button>
  <button onclick="Spaila.scheduleNotification(102, 'Background test', 'Alarm fired after 5 seconds', 5); Spaila.toast('Alarm set for 5 seconds')">Alarm in 5 seconds</button>
  <button onclick="Spaila.scheduleNotification(103, 'Background test', 'Alarm fired after 10 minutes', 600); Spaila.toast('Alarm set for 10 minutes')">Alarm in 10 minutes</button>
  <button onclick="Spaila.cancelScheduledNotification(101); Spaila.cancelScheduledNotification(102); Spaila.toast('Cancelled')">Cancel alarms</button>
  <button onclick="Spaila.startKeepAlive('Keep-alive is on', 'Tap to open the app'); Spaila.toast('Keep-alive started')">Start keep-alive</button>
  <button onclick="Spaila.stopKeepAlive(); Spaila.toast('Keep-alive stopped')">Stop keep-alive</button>
  <button onclick="Spaila.openBatterySettings()">Open battery settings</button>
<script>
  window.onSpailaBack = function () { location.href = 'index.html'; return true; };
</script>
</body>
</html>
